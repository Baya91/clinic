  <script>
    function debounce(func, wait, immediate) {
      var timeout;
      return function () {
        var context = this,
          args = arguments;
        var later = function () {
          timeout = null;
          if (!immediate) func.apply(context, args);
        };
        var callNow = immediate && !timeout;
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
        if (callNow) func.apply(context, args);
      };
    }

    var onScroll = debounce(function (direction) {
      if (direction == false) {
        $("#w-slider-arrow-right").trigger('tap');
      } else {
        $("#w-slider-arrow-left").trigger('tap');
      }
    }, 200, true);

    $('#slider').bind('wheel mousewheel', function (e) {
      e.preventDefault();
      var delta;
      if (typeof event != 'undefined' && event.wheelDelta) {
        delta = event.wheelDelta;
      } else {
        delta = -1 * e.originalEvent.deltaY;
      }
      onScroll(delta >= 0);
    });

    function openNextHomeSlider() {
      $("#w-slider-arrow-right").trigger('tap');
    }

    var timerSlide;
    function activateAutoplay() {
      stopAutoplay()
      timerSlide = setTimeout(openNextHomeSlider, 6000);
    }
    function stopAutoplay() {
      if (timerSlide != undefined) {
        clearTimeout(timerSlide);
      }
    }

    $(document).ready(function () {
      $("#w-slider-arrow-right,#w-slider-arrow-left").on('tap', activateAutoplay);
      activateAutoplay();
    })
  </script>
